<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Ping-Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu">
        <h1>Ping-Pong</h1>
        <button id="local-game">Local Game</button>
        <button id="chat">Chat</button>
        <button id="online-game">Online Game</button>
    </div>

    <div id="online-game-menu" class="hidden">
        <h1>Online Game</h1>
        <button id="create-game">Create Game</button>
        <div id="game-list"></div>
        <button id="back-to-menu">Back</button>
    </div>

    <div id="game-screen" class="hidden">
        <h1>Game Area</h1>
        <button id="leave-game">Back</button>
    </div>

    <script src="client.js"></script>
</body>
</html>
