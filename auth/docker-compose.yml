version: '3.8'

services:
  app:
    build: .
    container_name: pong-user-management
    ports:
      - "3000:3000"
    volumes:
      - ./db:/app/db
      - ./public/img/avatars:/app/public/img/avatars
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - SESSION_SECRET=your-secret-key-change-me-in-production
    restart: unless-stopped
