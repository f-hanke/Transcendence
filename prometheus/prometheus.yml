global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq-service:15692']

  # All your microservices are working perfectly! 🎉
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8443']
    scheme: https
    tls_config:
      insecure_skip_verify: true

  - job_name: 'webserver'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['webserver:10005']

  - job_name: 'users-auth'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['users-auth:10004']

  - job_name: 'remote'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['remote-matchmaking:10002']

  - job_name: 'game-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['game-service:10003']

  - job_name: 'chat-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['chat-service:10001']
    