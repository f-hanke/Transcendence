## Default user and password
default_user = admin
default_pass = admin

## Allow the default user to connect from any host
loopback_users.admin = false

## Set memory threshold
vm_memory_high_watermark.relative = 0.4

## Default vhost
default_vhost = /

## Enable management plugin
management.tcp.port = 15672

## Enable metrics
management.rates_mode = basic

## Configure queues - Use min-masters for classic queue policy (RabbitMQ 3.x compatible)
classic_queue.default_version = 1