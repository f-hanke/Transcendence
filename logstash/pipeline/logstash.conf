input {
  # HTTP input for Winston transports with basic auth
  http {
    port => 5000
    host => "0.0.0.0"
    codec => json
    user => "${LOGSTASH_HTTP_USER}"
    password => "${LOGSTASH_HTTP_PASSWORD}"
    ssl_enabled => false
  }
  
  # TCP input with SSL
  tcp {
    port => 5001
    codec => json
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/certs/elasticsearch/elasticsearch.crt"
    ssl_key => "/usr/share/logstash/certs/elasticsearch/elasticsearch.key"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    ssl_verify => true
  }
  
  # UDP input (limited security options for UDP)
  udp {
    port => 5002
    codec => json
    # Note: UDP has limited security options, consider removing if not needed
  }
  
  # Beats input with SSL
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/certs/elasticsearch/elasticsearch.crt"
    ssl_key => "/usr/share/logstash/certs/elasticsearch/elasticsearch.key"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    ssl_client_authentication => "required"
  }
}

filter {
  # Add timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Service-specific filtering based on service field
  if [service] == "webserver" {
    mutate {
      add_field => { "[@metadata][service]" => "webserver" }
      add_tag => ["webserver"]
    }
  }
  else if [service] == "users-auth" {
    mutate {
      add_field => { "[@metadata][service]" => "auth" }
      add_tag => ["auth"]
    }
  }
  else if [service] == "game-service" {
    mutate {
      add_field => { "[@metadata][service]" => "game" }
      add_tag => ["game"]
    }
  }
  else if [service] == "chat-service" {
    mutate {
      add_field => { "[@metadata][service]" => "chat" }
      add_tag => ["chat"]
    }
  }
  else if [service] == "remote-matchmaking" {
    mutate {
      add_field => { "[@metadata][service]" => "remote" }
      add_tag => ["remote"]
    }
  }
  else if [service] == "api-gateway" {
    mutate {
      add_field => { "[@metadata][service]" => "gateway" }
      add_tag => ["gateway"]
    }
  }
  
  # Legacy type-based filtering for backward compatibility
  else if [type] == "auth-service" {
    mutate {
      add_field => { "[@metadata][service]" => "auth" }
      add_tag => ["auth"]
    }
  }
  else if [type] == "user-service" {
    mutate {
      add_field => { "[@metadata][service]" => "user" }
      add_tag => ["user"]
    }
  }
  else if [type] == "game-service" {
    mutate {
      add_field => { "[@metadata][service]" => "game" }
      add_tag => ["game"]
    }
  }
  else if [type] == "chat-service" {
    mutate {
      add_field => { "[@metadata][service]" => "chat" }
      add_tag => ["chat"]
    }
  }
  else if [type] == "notification-service" {
    mutate {
      add_field => { "[@metadata][service]" => "notification" }
      add_tag => ["notification"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    ssl_verification_mode => "full"
  }
  stdout { codec => rubydebug }
} 