input {
  tcp {
    port => 5000
    codec => json
  }
  udp {
    port => 5000
    codec => json
  }
  beats {
    port => 5044
  }
  http {
    port => 5000
    codec => json
  }
}

filter {
  # Add timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Service-specific filtering based on service field
  if [service] == "webserver" {
    mutate {
      add_field => { "[@metadata][service]" => "webserver" }
      add_tag => ["webserver"]
    }
  }
  else if [service] == "users-auth" {
    mutate {
      add_field => { "[@metadata][service]" => "auth" }
      add_tag => ["auth"]
    }
  }
  else if [service] == "game-service" {
    mutate {
      add_field => { "[@metadata][service]" => "game" }
      add_tag => ["game"]
    }
  }
  else if [service] == "chat-service" {
    mutate {
      add_field => { "[@metadata][service]" => "chat" }
      add_tag => ["chat"]
    }
  }
  else if [service] == "remote-matchmaking" {
    mutate {
      add_field => { "[@metadata][service]" => "remote" }
      add_tag => ["remote"]
    }
  }
  else if [service] == "api-gateway" {
    mutate {
      add_field => { "[@metadata][service]" => "gateway" }
      add_tag => ["gateway"]
    }
  }
  
  # Legacy type-based filtering for backward compatibility
  else if [type] == "auth-service" {
    mutate {
      add_field => { "[@metadata][service]" => "auth" }
      add_tag => ["auth"]
    }
  }
  else if [type] == "user-service" {
    mutate {
      add_field => { "[@metadata][service]" => "user" }
      add_tag => ["user"]
    }
  }
  else if [type] == "game-service" {
    mutate {
      add_field => { "[@metadata][service]" => "game" }
      add_tag => ["game"]
    }
  }
  else if [type] == "chat-service" {
    mutate {
      add_field => { "[@metadata][service]" => "chat" }
      add_tag => ["chat"]
    }
  }
  else if [type] == "notification-service" {
    mutate {
      add_field => { "[@metadata][service]" => "notification" }
      add_tag => ["notification"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
} 