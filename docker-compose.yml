services:
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.12.1
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - ELASTICSEARCH_SSL_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:8.12.1
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "127.0.0.1:5044:5044"     # Beats input
      - "127.0.0.1:5000:5000"     # HTTP input (for Winston)
      - "127.0.0.1:5001:5001"     # TCP input  
      - "127.0.0.1:5002:5002/udp" # UDP input
      - "127.0.0.1:9600:9600"     # Logstash monitoring API
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/?pretty"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring-network
      - rabbitmq-network
    user: "0:0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/microservices-dashboard.json
    depends_on:
      prometheus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network
      - rabbitmq-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  rabbitmq-service:
    container_name: rabbitmq-service
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"   # RabbitMQ main port
      - "127.0.0.1:15672:15672" # Management UI
      - "127.0.0.1:15692:15692" # Prometheus metrics
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./rabbitmq/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rabbitmq-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: apiGateway/Dockerfile
    ports:
      - "8443:8443"  # Only expose HTTPS
    environment:
      - NODE_ENV=production
      - JWT_SECRET=supersecret
      - WEBSERVER_HOST=webserver
      - AUTH_SERVICE_HOST=users-auth
      - SERVICE_NAME=api-gateway
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      webserver:
        condition: service_healthy
      users-auth:
        condition: service_healthy
      remote:
        condition: service_healthy
      game-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

  webserver:
    container_name: webserver
    build:
      context: .
      dockerfile: webserver/Dockerfile
    ports:
      - "10005"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=webserver
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      elasticsearch:
        condition: service_healthy
    expose:
      - "10005"

  users-auth:
    container_name: users-auth
    build:
      context: .
      dockerfile: usersAndAuth/Dockerfile
    ports:
      - "10004"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=supersecret
      - RABBITMQ_HOST=rabbitmq-service
      - SERVICE_NAME=users-auth
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - users-auth-db-data:/app/usersAndAuth/db
    expose:
      - "10004"

  remote:
    container_name: remote-matchmaking
    build:
      context: .
      dockerfile: remote/Dockerfile
    ports:
      - "10002"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=remote-matchmaking
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      users-auth:
        condition: service_healthy
      rabbitmq-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - remote-db-data:/app/remote/db_file
    expose:
      - "10002"

  game-service:
    container_name: game-service
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "10003"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=game-service
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      remote:
        condition: service_healthy
    expose:
      - "10003"

  chat-service:
    container_name: chat-service
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "10001"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=chat-service
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      users-auth:
        condition: service_healthy
      rabbitmq-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - chat-service-db-data:/app/chat-service/db
    expose:
      - "10001"

networks:
  monitoring-network:
    driver: bridge
  rabbitmq-network:
    driver: bridge
  app-network:
    driver: bridge

volumes:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
  chat-service-db-data:
  remote-db-data:
  users-auth-db-data:
