services:
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.12.1
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - ELASTICSEARCH_SSL_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:8.12.1
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "127.0.0.1:5044:5044"
      - "127.0.0.1:5000:5000/tcp"
      - "127.0.0.1:5000:5000/udp"
      - "127.0.0.1:9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/?pretty"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring-network
      - rabbitmq-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/microservices-dashboard.json
    depends_on:
      prometheus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network
      - rabbitmq-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: apiGateway/Dockerfile
    ports:
      - "8443:8443"  # Only expose HTTPS
    environment:
      - NODE_ENV=production
      - JWT_SECRET=supersecret
      - WEBSERVER_HOST=webserver
      - AUTH_SERVICE_HOST=users-auth
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      webserver:
        condition: service_healthy
      users-auth:
        condition: service_healthy
      remote:
        condition: service_healthy
      game-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

  webserver:
    container_name: webserver
    build:
      context: .
      dockerfile: webserver/Dockerfile
    ports:
      - "10005"
    environment:
      - NODE_ENV=production
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "10005"

  users-auth:
    container_name: users-auth
    build:
      context: .
      dockerfile: usersAndAuth/Dockerfile
    ports:
      - "10004"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=supersecret
      - RABBITMQ_HOST=rabbitmq-service
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    external_links:
      - rabbitmq-service
    expose:
      - "10004"

  remote:
    container_name: remote-matchmaking
    build:
      context: .
      dockerfile: remote/Dockerfile
    ports:
      - "10002"
    environment:
      - NODE_ENV=production
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      users-auth:
        condition: service_healthy
    expose:
      - "10002"

  game-service:
    container_name: game-service
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "10003"
    environment:
      - NODE_ENV=production
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      remote:
        condition: service_healthy
    expose:
      - "10003"

  chat-service:
    container_name: chat-service
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "10001"
    environment:
      - NODE_ENV=production
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - users-auth
    expose:
      - "10001"

networks:
  monitoring-network:
    driver: bridge
  rabbitmq-network:
    external: true
  app-network:
    driver: bridge

volumes:
  elasticsearch-data:
  prometheus-data:
  grafana-data: 
