services:
  # Setup service to initialize Elasticsearch with security
  elasticsearch-setup:
    container_name: elasticsearch-setup
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    volumes:
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: elasticsearch\n"\
          "    dns:\n"\
          "      - elasticsearch\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: kibana\n"\
          "    dns:\n"\
          "      - kibana\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 755 \{\} \;;
        find . -type f -exec chmod 644 \{\} \;;
        echo "Certificate setup complete!";
      '

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - node.name=elasticsearch
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE:-basic}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 120
      start_period: 30s
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.12.1
    labels:
      co.elastic.logs/module: kibana
    volumes:
      - elasticsearch-certs:/usr/share/kibana/config/certs
      - kibana-data:/usr/share/kibana/data
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./kibana/dashboards:/usr/share/kibana/dashboards:ro
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - XPACK_SECURITY_ENCRYPTIONKEY=${ENCRYPTION_KEY:-}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ENCRYPTION_KEY:-}
      - XPACK_REPORTING_ENCRYPTIONKEY=${ENCRYPTION_KEY:-}
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 120
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana-setup:
    container_name: kibana-setup
    image: curlimages/curl:latest
    volumes:
      - ./kibana/setup/import-dashboards.sh:/import-dashboards.sh:ro
      - ./kibana/dashboards:/dashboards:ro
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    command: ["/bin/sh", "/import-dashboards.sh"]
    networks:
      - monitoring-network
    depends_on:
      kibana:
        condition: service_healthy

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:8.12.1
    labels:
      co.elastic.logs/module: logstash  
    volumes:
      - elasticsearch-certs:/usr/share/logstash/certs
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "127.0.0.1:5044:5044"     # Beats input
      - "127.0.0.1:5000:5000"     # HTTP input (for Winston)
      - "127.0.0.1:5001:5001"     # TCP input  
      - "127.0.0.1:5002:5002/udp" # UDP input
      - "127.0.0.1:9600:9600"     # Logstash monitoring API
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
      ELASTIC_USER: "elastic"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      ELASTIC_HOSTS: "https://elasticsearch:9200"
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/?pretty"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/init-prometheus.sh:/init-prometheus.sh:ro
      - prometheus-data:/prometheus
      - elasticsearch-certs:/etc/prometheus/certs:ro
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    entrypoint: ["/bin/sh", "/init-prometheus.sh"]
    command:
      - '/bin/prometheus'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring-network
      - rabbitmq-network
    user: "0:0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      elasticsearch:
        condition: service_healthy

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/microservices-dashboard.json
    depends_on:
      prometheus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring-network
      - rabbitmq-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  rabbitmq-service:
    container_name: rabbitmq-service
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"   # RabbitMQ main port
      - "127.0.0.1:15672:15672" # Management UI
      - "127.0.0.1:15692:15692" # Prometheus metrics
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./rabbitmq/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/config/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rabbitmq-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: apiGateway/Dockerfile
    ports:
      - "8443:8443"  # Only expose HTTPS
    volumes:
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    environment:
      - NODE_ENV=production
      - JWT_SECRET=a03a3a0fa94982e1ebed6f5146fa322e
      - WEBSERVER_HOST=webserver
      - AUTH_SERVICE_HOST=users-auth
      - SERVICE_NAME=api-gateway
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      webserver:
        condition: service_healthy
      users-auth:
        condition: service_healthy
      remote:
        condition: service_healthy
      game-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  webserver:
    container_name: webserver
    build:
      context: .
      dockerfile: webserver/Dockerfile
    ports:
      - "10005"
    volumes:
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=webserver
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      elasticsearch:
        condition: service_healthy
    expose:
      - "10005"

  users-auth:
    container_name: users-auth
    build:
      context: .
      dockerfile: usersAndAuth/Dockerfile
    ports:
      - "10004"
    volumes:
      - users-auth-db-data:/app/usersAndAuth/db
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    environment:
      - NODE_ENV=production
      - JWT_SECRET=supersecret
      - RABBITMQ_HOST=rabbitmq-service
      - SERVICE_NAME=users-auth
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    expose:
      - "10004"

  remote:
    container_name: remote-matchmaking
    build:
      context: .
      dockerfile: remote/Dockerfile
    ports:
      - "10002"
    volumes:
      - remote-db-data:/app/db_file
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=remote-matchmaking
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      users-auth:
        condition: service_healthy
      rabbitmq-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    expose:
      - "10002"

  game-service:
    container_name: game-service
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "10003"
    volumes:
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=game-service
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      remote:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    expose:
      - "10003"

  chat-service:
    container_name: chat-service
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "10001"
    volumes:
      - chat-service-db-data:/app/db
      - elasticsearch-certs:/usr/share/elasticsearch/config/certs
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=chat-service
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    networks:
      - monitoring-network
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      users-auth:
        condition: service_healthy
      rabbitmq-service:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    expose:
      - "10001"

networks:
  monitoring-network:
    driver: bridge
  rabbitmq-network:
    driver: bridge
  app-network:
    driver: bridge

volumes:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  rabbitmq-data:
  chat-service-db-data:
  remote-db-data:
  users-auth-db-data:
  elasticsearch-certs:
  kibana-data:
