services:
  rabbitmq-service:
      container_name: rabbitmq-service
      image: rabbitmq:3-management
      ports:
        - "127.0.0.1:5672:5672"   # RabbitMQ main port
        - "127.0.0.1:15672:15672" # Management UI
      environment:
        - RABBITMQ_DEFAULT_USER=admin
        - RABBITMQ_DEFAULT_PASS=admin
      volumes:
        - ./rabbitmq/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        - ./rabbitmq/config/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
        - ./rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
        - rabbitmq-data:/var/lib/rabbitmq
      networks:
        - rabbitmq-network
      healthcheck:
        test: ["CMD", "rabbitmqctl", "status"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 40s

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: apiGateway/Dockerfile
    ports:
      - "8443:8443"  # Only expose HTTPS

    environment:
      - NODE_ENV=production
      - JWT_SECRET
      - WEBSERVER_HOST=webserver
      - AUTH_SERVICE_HOST=users-auth
      - SERVICE_NAME=api-gateway
    networks:
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      webserver:
        condition: service_healthy
      users-auth:
        condition: service_healthy
      remote:
        condition: service_healthy
      game-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

  webserver:
    container_name: webserver
    build:
      context: .
      dockerfile: webserver/Dockerfile
    ports:
      - "10005"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=webserver
    networks:
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "10005"

  users-auth:
    container_name: users-auth
    build:
      context: .
      dockerfile: usersAndAuth/Dockerfile
    ports:
      - "10004"
    volumes:
      - users-auth-db-data:/app/usersAndAuth/db
    environment:
      - NODE_ENV=production
      - JWT_SECRET
      - SERVICE_NAME=users-auth
    networks:
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq-service:
        condition: service_healthy
    expose:
      - "10004"

  remote:
    container_name: remote-matchmaking
    build:
      context: .
      dockerfile: remote/Dockerfile
    ports:
      - "10002"
    volumes:
      - remote-db-data:/app/remote/db_file
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=remote-matchmaking
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      users-auth:
        condition: service_healthy
    expose:
      - "10002"

  game-service:
    container_name: game-service
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "10003"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=game-service
    networks:
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      remote:
        condition: service_healthy
    expose:
      - "10003"

  chat-service:
    container_name: chat-service
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "10001"
    volumes:
      - chat-service-db-data:/app/chat-service/db
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=chat-service
      - JWT_SECRET
    networks:
      - rabbitmq-network
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      users-auth:
        condition: service_healthy
      rabbitmq-service:
        condition: service_healthy
    expose:
      - "10001"

networks:
  rabbitmq-network:
    driver: bridge
  app-network:
    driver: bridge

volumes:
  chat-service-db-data:
  remote-db-data:
  users-auth-db-data:
  rabbitmq-data:

