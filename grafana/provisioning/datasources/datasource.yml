apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    database: "microservices-logs-*"
    url: http://elasticsearch:9200
    jsonData:
      esVersion: 8.12.1
      timeField: "@timestamp"
    version: 1
    editable: true 