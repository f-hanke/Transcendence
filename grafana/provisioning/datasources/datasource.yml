apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: https://prometheus:9090
    isDefault: true
    version: 1
    editable: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: ${PROMETHEUS_PASSWORD}
    jsonData:
      tlsSkipVerify: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    database: "microservices-logs-*"
    url: https://elasticsearch:9200
    basicAuth: true
    basicAuthUser: elastic
    secureJsonData:
      basicAuthPassword: ${ELASTIC_PASSWORD}
    jsonData:
      esVersion: 8.12.1
      timeField: "@timestamp"
      tlsSkipVerify: true
    version: 1
    editable: true 